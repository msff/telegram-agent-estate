# gitleaks config for telegram-agent-estate.
#
# Run it over the whole history, not just the tip:
#
#   gitleaks detect --source . --config .github/secret-patterns.toml \
#                   --redact --log-opts="--all"
#
# `--redact` is not decoration. An unredacted report of a live token is one more
# copy of it — in a terminal, in a scrollback, and quite possibly in whatever is
# recording the session.
#
# ---------------------------------------------------------------------------
# TWO JOBS, and a single rule set does neither well without saying which is which.
#
#   1. CREDENTIALS. A live token in the history is an incident, and the order of
#      operations is REVOKE, then rewrite. Rewriting alone leaves the secret
#      valid and merely harder to find — every clone taken before the rewrite
#      still has it, and so does every fork and every CI cache.
#
#   2. PERSONAL DATA. A home directory, a chat id, the name of another project
#      on the same machine. None of it is a credential and none of it is
#      dangerous; it is simply not yours to publish. This codebase was extracted
#      from one person's machine, so it is the likelier finding by far.
#
# THE PATTERNS BELOW DESCRIBE SHAPES, NOT VALUES. An earlier version of this
# file listed the original author's actual home directory, chat id and email so
# it could hunt for them — which made the file, in a public repo, a published
# copy of the exact data it existed to keep out. Shapes also catch the NEXT
# contributor's home directory, which a list of one person's strings never
# could.
#
# `tests/test_templates.py` enforces the same shapes at HEAD on every test run,
# and the CI job in `ci.yml` runs this config over the full history. The two
# lists have to agree: a pattern added there and not here guards the present and
# leaves the past.
#
# If you are scrubbing YOUR OWN values out of a fork's history, put them in a
# local config and do not commit it — the point of this file is that it is safe
# to publish.

title = "telegram-agent-estate"

[extend]
useDefault = true          # upstream rules: AWS, GCP, Slack, Stripe, and so on

# --- credentials --------------------------------------------------------------

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot API token (bot id : secret)"
# `<digits>:<35 chars>`. The bot-id half is public — it is in every API URL — so
# it is the second half that matters. The colon is what makes the pair specific
# enough to match without flooding on ordinary numbers.
regex = '''\b[0-9]{8,12}:[A-Za-z0-9_-]{35}\b'''
keywords = ["bot"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key — must never appear here at all: turns are billed to the keychain OAuth subscription and the runner drops this variable unconditionally"
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant"]

[[rules]]
id = "github-token"
description = "GitHub PAT or OAuth token"
regex = '''\b(gh[pousr]_[A-Za-z0-9]{36,255})\b'''
keywords = ["gho_", "ghp_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "generic-token-assignment"
description = "A token-shaped value assigned to a token-shaped name"
regex = '''(?i)\b(api[_-]?key|secret|token|passwd|password)\s*[:=]\s*['"]?[A-Za-z0-9_\-]{16,}['"]?'''
keywords = ["key", "secret", "token", "password"]
[rules.allowlist]
regexTarget = "match"
# Fixture values that exist in order to be found by the code under test. Each
# announces itself in capitals; none is a credential to anything.
regexes = ['''USERSCOPESECRET''', '''PROJECTSCOPESECRET''', '''(?i)fake-|dummy|placeholder''']

# --- personal data -------------------------------------------------------------
#
# In the same file as the credentials on purpose: they are scrubbed in one pass,
# and a second config is a second thing to forget to run.
#
# THESE READ DIFFERENTLY FROM THEIR TWINS IN `tests/test_templates.py`, and the
# reason is not style. gitleaks is Go, so its regexes are RE2, which has no
# lookaround at all — `(?!example\b)` is not "unsupported here and fine there",
# it is a panic at startup. Python's `re` has it, so the test states its
# exclusions inline. Here the same exclusions are per-rule allowlists, which is
# what RE2 engines give you instead. Keep the two in step by MEANING; expecting
# them to look alike is what will break this file.

[[rules]]
id = "real-home-directory"
description = "Somebody's actual home directory (the docs placeholder is /Users/example)"
# The first character may not be a dot, or the `/Users/...` written in prose to
# mean "the expanded form of this path" is a finding on every run.
regex = '''/Users/[A-Za-z0-9_-][A-Za-z0-9._-]*'''
[rules.allowlist]
regexTarget = "match"
regexes = ['''/Users/example\b''']

[[rules]]
id = "real-email-address"
description = "A contactable email address"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''@users\.noreply\.github\.com\b''',
  '''@example\.(?:com|org|net)\b''',
  '''@[A-Za-z0-9.-]+\.(?:invalid|test|example)\b''',
]

[[rules]]
id = "real-chat-id"
description = "A Telegram chat id belonging to a person"
# ANCHORED TO CONTEXT, NOT SHAPE. Chat ids, update ids and the legacy
# `999000000+seq` scheduler ids are all 9-to-12-digit numbers, so a bare
# `\d{9,12}` flags a dozen legitimate fixtures and trains the reader to widen
# the allowlist until the rule means nothing. What identifies a chat id is the
# name next to it. The eight-digit floor lets short obviously-fake ids through;
# a real Telegram account id has not been that short in many years.
regex = '''(?i)(?:owner[_ ]?chat[_ ]?id|chat[_ ]?id|\bOWNER\b|\bCHAT\b)\s*[=:]\s*['"]?[0-9]{8,}'''
[rules.allowlist]
regexTarget = "match"
# `0` matches nobody by design; `100000000xx` is the suite's fixture range,
# chosen so that no real id is ever a plausible-looking fixture.
regexes = ['''[=:]\s*['"]?0\b''', '''10000000[0-9]{3}''']

[[rules]]
id = "real-reverse-domain"
description = "A launchd prefix that belongs to someone (the template ships com.example)"
regex = '''\b(?:co|com|io|net|org|dev)\.[a-z0-9-]{2,}\.[a-z0-9-]+'''
[rules.allowlist]
regexTarget = "match"
regexes = ['''\b(?:co|com)\.example\b''', '''\bcom\.example\.''']

[[rules]]
id = "synced-folder-path"
description = "A path into somebody's synced storage"
# The prose discusses Dropbox and iCloud at length as hazards, which is the
# point of the project; it is the `~/`-rooted PATH form that says whose machine
# this was written on.
regex = '''~/(?:Dropbox|Google Drive|Library/Mobile Documents)'''

# --- allowlist ------------------------------------------------------------------

[allowlist]
description = "Things that look like findings and are not"

paths = [
  # Both of these declare the patterns in order to forbid them, so both match
  # themselves by construction. `tests/test_templates.py` states the same
  # self-exclusion in its own comments and skips itself in the repo sweep; this
  # is the same hole, kept the same two files wide, deliberately.
  '''\.github/secret-patterns\.toml''',
  '''tests/test_templates\.py''',
]

regexes = [
  # The shipped template's placeholder chat id. It matches nobody, which is the
  # point: an unedited config talks to a chat that does not exist rather than to
  # a stranger.
  '''owner_chat_id:\s*0\b''',
  # Deliberately fake fixture secrets. They exist to be found by the code under
  # test, and each is obviously not a credential to a human reading the line.
  '''USERSCOPESECRET''',
  '''fake-[a-z]+''',
  # Prose that names a forbidden thing in order to forbid it.
  '''(?i)must never|never set|do not set|is dropped unconditionally''',
]
